<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Request Password Change - Skills Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
        .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .btn-submit {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2); }
        .btn-submit:active { transform: translateY(0); }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1e3a8a;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .info-badge { background: #e0e7ff; border-left: 4px solid #4f46e5; padding: 12px 16px; border-radius: 12px; margin-bottom: 24px; }
        .success-message { background: #d1fae5; border-left: 4px solid #10b981; color: #065f46; }
        .error-message { background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl card-shadow w-full max-w-md overflow-hidden fade-in">
        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 px-6 py-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Request Password Change</h1>
            <p class="text-blue-200 text-sm mt-1">Skills Matrix Portal — Dawlance</p>
        </div>

        <div class="p-6">
            <div class="info-badge">
                <div class="flex gap-2">
                    <svg class="w-5 h-5 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                    <p class="text-sm text-gray-700">Your request will be sent to the admin for approval. Your password will only change once approved.</p>
                </div>
            </div>

            <form id="requestForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" id="name" class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="e.g., Muhammad Ali" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Email (optional)</label>
                    <input type="email" id="email" class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Role</label>
                    <select id="role" class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white" required>
                        <option value="employee">👤 Employee</option>
                        <option value="manager">👔 Manager</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">New Password</label>
                    <input type="password" id="password" class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="••••••••" required>
                    <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="input-field w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit w-full text-white py-3 rounded-xl font-semibold transition-all duration-200 shadow-md">
                    <span id="submitText">Submit Password Request</span>
                    <span id="submitSpinner" class="hidden"></span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login.html" class="text-sm text-indigo-600 hover:text-indigo-800 hover:underline transition-all">← Back to login</a>
            </div>
            <div id="message" class="mt-6 text-center text-sm rounded-xl p-3 hidden"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        const ENDPOINT = `${API_BASE}/admin/password-requests`;

        const form = document.getElementById('requestForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            const newPassword = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = form.querySelector('button[type="submit"]');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');

            if (!name) { showMessage('Please enter your full name.', 'error'); return; }
            if (newPassword !== confirmPassword) { showMessage('Passwords do not match.', 'error'); return; }
            if (newPassword.length < 6) { showMessage('Password must be at least 6 characters.', 'error'); return; }

            submitBtn.disabled = true;
            submitText.classList.add('hidden');
            submitSpinner.classList.remove('hidden');
            messageDiv.classList.add('hidden');

            try {
                const payload = { name, role, newPassword };
                if (email) payload.email = email;

                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('✅ <strong>Request submitted!</strong><br>An administrator will review your request.', 'success');
                    form.reset();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed to submit request.'), 'error');
                }
            } catch (err) {
                showMessage('❌ Network error: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitText.classList.remove('hidden');
                submitSpinner.classList.add('hidden');
            }
        });

        function showMessage(html, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = html;
            msgDiv.className = `mt-6 text-center text-sm rounded-xl p-3 ${type === 'error' ? 'error-message' : 'success-message'}`;
            msgDiv.classList.remove('hidden');
        }

        // Real‑time password match indicator
        const pwd = document.getElementById('password');
        const confirm = document.getElementById('confirmPassword');
        function checkMatch() {
            if (confirm.value.length && pwd.value !== confirm.value) {
                showMessage('⚠️ Passwords do not match.', 'error');
            } else if (pwd.value === confirm.value && confirm.value.length) {
                const msgDiv = document.getElementById('message');
                if (msgDiv.innerHTML.includes('do not match')) msgDiv.classList.add('hidden');
            }
        }
        pwd.addEventListener('input', checkMatch);
        confirm.addEventListener('input', checkMatch);
    </script>
</body>
</html>
