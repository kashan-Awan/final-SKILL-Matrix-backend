<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Password Change Approvals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e9eef5 100%); }
        .card-shadow { transition: all 0.2s ease; }
        .card-shadow:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .status-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-approved { background: #d1fae5; color: #059669; }
        .status-rejected { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='/current-users.html'" class="p-2 hover:bg-gray-100 rounded-xl">
                <svg class="w-5 h-5 text-[#1E3A8A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
            </button>
            <div class="h-8 w-px bg-gray-200"></div>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-[#1E3A8A] to-[#2563eb] rounded-xl flex items-center justify-center shadow-md">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-gray-800">Password Change Approvals</h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="logoutBtn" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
            </button>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 pb-32">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-gray-800">Password Change Requests</h2>
        <p class="text-gray-500 text-sm mt-1">Review and approve or reject user requests</p>
    </div>

    <!-- Status Tabs -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
        <div class="flex gap-1 border-b border-gray-200 pb-2">
            <button data-status="pending" class="status-tab px-5 py-2 text-sm font-semibold rounded-lg bg-[#1E3A8A] text-white shadow-sm">📋 Pending</button>
            <button data-status="approved" class="status-tab px-5 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:bg-gray-100">✅ Approved</button>
            <button data-status="rejected" class="status-tab px-5 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:bg-gray-100">❌ Rejected</button>
        </div>
    </div>

    <!-- Requests Container -->
    <div id="requestsContainer" class="space-y-4">
        <div class="text-center text-gray-400 py-16">Loading requests...</div>
    </div>
</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-sm border-t border-gray-200 flex items-center justify-around py-2 px-4 z-50 shadow-lg">
    <button onclick="window.location.href='/current-users.html'" class="flex flex-col items-center gap-1 py-2 px-6 rounded-xl text-gray-500 hover:text-[#1E3A8A] group">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <span class="text-[11px] font-semibold tracking-wide">Users</span>
    </button>
    <button onclick="window.location.href='/approve-password-requests.html'" class="flex flex-col items-center gap-1 py-2 px-6 rounded-xl bg-[#1E3A8A] text-white shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
        <span class="text-[11px] font-semibold tracking-wide">Password</span>
    </button>
    <button onclick="window.location.href='/approve-registrations.html'" class="flex flex-col items-center gap-1 py-2 px-6 rounded-xl text-gray-500 hover:text-[#1E3A8A] group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        <span class="text-[11px] font-semibold tracking-wide">Registrations</span>
    </button>
</nav>

<script>
const getToken = () => localStorage.getItem('adminToken');
const API_BASE = window.location.origin + '/api';

let currentStatus = 'pending';

function checkAuth() {
    const token = getToken();
    if (!token) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function loadRequests() {
    try {
        const response = await fetch(`${API_BASE}/admin/password-requests?status=${currentStatus}`, {
            headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (response.status === 401) {
            localStorage.removeItem('adminToken');
            window.location.href = '/login.html';
            return;
        }
        const data = await response.json();
        const container = document.getElementById('requestsContainer');
        if (data.success && data.data && data.data.length > 0) {
            container.innerHTML = data.data.map(req => `
                <div class="bg-white rounded-2xl card-shadow p-5 border border-gray-100">
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3 mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 flex-wrap mb-2">
                                <span class="status-badge ${currentStatus === 'pending' ? 'status-pending' : currentStatus === 'approved' ? 'status-approved' : 'status-rejected'}">
                                    ${req.status.toUpperCase()}
                                </span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800">${escapeHtml(req.name)}</h3>
                            <p class="text-sm text-gray-500">${escapeHtml(req.email)}</p>
                            <p class="text-xs text-gray-400 mt-1">User ID: ${escapeHtml(req.userId)}</p>
                        </div>
                        <div class="text-left sm:text-right">
                            <p class="text-xs text-gray-400">Requested</p>
                            <p class="text-sm font-medium text-gray-600">${new Date(req.requestedAt).toLocaleString()}</p>
                        </div>
                    </div>
                    ${currentStatus === 'pending' ? `
                        <div class="flex gap-3 mt-3">
                            <button onclick="approveRequest('${req.id}')" class="flex-1 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                                Approve
                            </button>
                            <button onclick="rejectRequest('${req.id}')" class="flex-1 py-2.5 border-2 border-red-500 text-red-600 hover:bg-red-50 rounded-xl font-semibold flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                                Reject
                            </button>
                        </div>
                    ` : currentStatus === 'rejected' && req.rejectionReason ? `
                        <div class="mt-4 p-3 bg-red-50 rounded-xl border border-red-100">
                            <p class="text-xs font-semibold text-red-600">Rejection Reason</p>
                            <p class="text-sm text-red-700">${escapeHtml(req.rejectionReason)}</p>
                        </div>
                    ` : ''}
                    ${currentStatus !== 'pending' && req.resolvedAt ? `
                        <div class="mt-3 pt-3 border-t border-gray-100 text-right">
                            <span class="text-xs text-gray-400">Resolved: ${new Date(req.resolvedAt).toLocaleString()}</span>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        } else {
            container.innerHTML = `<div class="bg-white rounded-2xl p-12 text-center"><div class="text-7xl mb-4">🔐</div><h3 class="text-lg font-semibold text-gray-700">No ${currentStatus} password requests</h3></div>`;
        }
    } catch (err) {
        document.getElementById('requestsContainer').innerHTML = `<div class="bg-red-50 rounded-2xl p-6 text-center text-red-600">Error: ${err.message}</div>`;
    }
}

async function approveRequest(requestId) {
    if (!confirm('Approve this password change request? The user will be able to log in with the new password.')) return;
    try {
        const response = await fetch(`${API_BASE}/admin/password-requests/${requestId}/approve`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        if (data.success) {
            alert('✅ Password change approved and applied.');
            loadRequests();
        } else {
            alert(data.message || 'Approval failed');
        }
    } catch (err) {
        alert('Error approving request');
    }
}

async function rejectRequest(requestId) {
    const reason = prompt('Optional rejection reason:');
    if (reason === null) return; // user cancelled
    if (!confirm('Reject this password change request?')) return;
    try {
        const response = await fetch(`${API_BASE}/admin/password-requests/${requestId}/reject`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ rejectionReason: reason || null })
        });
        const data = await response.json();
        if (data.success) {
            alert('❌ Request rejected');
            loadRequests();
        } else {
            alert(data.message || 'Rejection failed');
        }
    } catch (err) {
        alert('Error rejecting request');
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// Tab switching
document.querySelectorAll('.status-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.status-tab').forEach(t => {
            t.classList.remove('bg-[#1E3A8A]', 'text-white', 'shadow-sm');
            t.classList.add('text-gray-600', 'hover:bg-gray-100');
        });
        tab.classList.add('bg-[#1E3A8A]', 'text-white', 'shadow-sm');
        tab.classList.remove('text-gray-600', 'hover:bg-gray-100');
        currentStatus = tab.dataset.status;
        loadRequests();
    });
});

document.getElementById('logoutBtn')?.addEventListener('click', () => {
    localStorage.removeItem('adminToken');
    window.location.href = '/login.html';
});

if (checkAuth()) {
    loadRequests();
}
</script>
</body>
</html>
