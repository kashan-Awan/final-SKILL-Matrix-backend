<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Add User - Admin Control</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8F9FC; }
    .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .role-btn { transition: all 0.2s ease; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='/current-users.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <svg class="w-5 h-5 text-[#1E3A8A]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </button>
      <h1 class="text-xl font-bold text-[#1E3A8A]">Add New User</h1>
    </div>
    <div class="flex items-center gap-3">
      <button id="logoutBtn" class="text-sm text-gray-600 hover:text-red-600 transition-colors flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
        Logout
      </button>
      <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-gray-200 bg-gray-100 flex items-center justify-center">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 pb-24">
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
      <div class="p-5 bg-gray-50 border-b border-gray-200">
        <h2 class="text-lg font-bold text-gray-800">Account Credentials</h2>
        <p class="text-sm text-gray-500 mt-1">Fill in the user details below. All fields marked * are required.</p>
      </div>

      <form id="addUserForm" class="p-5 space-y-5">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Full Name *</label>
          <input id="fullName" type="text" required class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="e.g., John Doe">
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Email *</label>
          <input id="email" type="email" required class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="name@organization.com">
        </div>

        <!-- Password & Confirm -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Password *</label>
            <div class="relative">
              <input id="password" type="password" required class="input-field w-full border border-gray-300 rounded-lg p-3 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="••••••••">
              <button type="button" id="togglePassword" class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                  <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
              </button>
            </div>
            <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Confirm Password *</label>
            <input id="confirmPassword" type="password" required class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="••••••••">
          </div>
        </div>

        <!-- Employee ID -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Employee ID</label>
          <input id="employeeId" type="text" class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="EMP001">
        </div>

        <!-- Role Toggle -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Access Tier *</label>
          <div class="flex p-1 bg-gray-100 border border-gray-200 rounded-lg">
            <button type="button" data-role="EMPLOYEE" class="role-btn flex-1 py-2 text-sm font-semibold rounded-md bg-[#1E3A8A] text-white shadow-md transition-all">Employee</button>
            <button type="button" data-role="MANAGER" class="role-btn flex-1 py-2 text-sm font-semibold text-gray-600 hover:bg-white rounded-md transition-all">Manager</button>
            <button type="button" data-role="ADMIN" class="role-btn flex-1 py-2 text-sm font-semibold text-gray-600 hover:bg-white rounded-md transition-all">Admin</button>
          </div>
          <input type="hidden" id="selectedRole" value="EMPLOYEE">
        </div>

        <!-- Department -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Department</label>
          <select id="departmentId" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Select Department</option>
          </select>
          <p id="deptError" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Phone</label>
          <input id="phone" type="tel" class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="+92 XXX XXXXXXX">
        </div>

        <!-- Gender -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Gender</label>
          <select id="gender" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Job Title -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Job Title</label>
          <input id="title" type="text" class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="e.g., Senior Manager">
        </div>

        <!-- Years of Experience -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Years of Experience</label>
          <input id="yearsExperience" type="number" class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="0" min="0">
        </div>

        <!-- Hire Date -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Hire Date</label>
          <input id="hireDate" type="date" class="input-field w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full bg-[#1E3A8A] hover:bg-blue-900 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20 transition-all active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
          <span id="submitText">Create User</span>
          <span id="submitSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        </button>
      </form>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 flex items-center justify-around py-3 px-4 z-50 shadow-up">
    <button onclick="window.location.href='/current-users.html'" class="flex flex-col items-center bg-[#1E3A8A] text-white py-2 px-8 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Users</span>
    </button>
    <button onclick="window.location.href='/approve-request.html'" class="flex flex-col items-center text-gray-500 hover:text-[#1E3A8A] transition-colors py-2 px-8">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Approvals</span>
    </button>
    <button onclick="window.location.href='/approve-registrations.html'" class="flex flex-col items-center text-gray-500 hover:text-[#1E3A8A] transition-colors py-2 px-8">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Registrations</span>
    </button>
  </nav>

  <script>
    // ========== CONFIGURATION ==========
    const API_BASE = window.location.origin + '/api';
    const getToken = () => localStorage.getItem('adminToken');

    // ========== AUTH & TOKEN HANDLING ==========
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get('token');
    if (urlToken) {
      localStorage.setItem('adminToken', urlToken);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    function checkAuth() {
      const token = getToken();
      if (!token) {
        window.location.href = 'http://localhost:3000/login';
        return false;
      }
      return true;
    }

    // ========== LOAD DEPARTMENTS ==========
    async function loadDepartments() {
      const deptSelect = document.getElementById('departmentId');
      const deptError = document.getElementById('deptError');
      try {
        const response = await fetch(`${API_BASE}/departments`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (response.status === 401) {
          localStorage.removeItem('adminToken');
          window.location.href = 'http://localhost:3000/login';
          return;
        }
        const data = await response.json();
        if (data.success && Array.isArray(data.data)) {
          deptSelect.innerHTML = '<option value="">Select Department</option>';
          data.data.forEach(dept => {
            deptSelect.innerHTML += `<option value="${dept.id || dept._id}">${escapeHtml(dept.name)}</option>`;
          });
        } else {
          deptError.textContent = 'Could not load departments. You can still create a user without department.';
          deptError.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Load departments error:', err);
        deptError.textContent = 'Failed to load departments. Check your connection.';
        deptError.classList.remove('hidden');
      }
    }

    // ========== ROLE BUTTON TOGGLE ==========
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach(b => {
          b.classList.remove('bg-[#1E3A8A]', 'text-white', 'shadow-md');
          b.classList.add('text-gray-600', 'hover:bg-white');
        });
        btn.classList.remove('text-gray-600', 'hover:bg-white');
        btn.classList.add('bg-[#1E3A8A]', 'text-white', 'shadow-md');
        document.getElementById('selectedRole').value = btn.dataset.role;
      });
    });

    // ========== PASSWORD VISIBILITY TOGGLE ==========
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
    });

    // ========== FORM SUBMISSION ==========
    const form = document.getElementById('addUserForm');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');
    const submitSpinner = document.getElementById('submitSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Gather data
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.getElementById('selectedRole').value;
      const employeeId = document.getElementById('employeeId').value.trim() || null;
      const departmentId = document.getElementById('departmentId').value || null;
      const phone = document.getElementById('phone').value.trim() || null;
      const gender = document.getElementById('gender').value || null;
      const title = document.getElementById('title').value.trim() || null;
      const yearsExperience = parseInt(document.getElementById('yearsExperience').value) || null;
      const hireDate = document.getElementById('hireDate').value || null;

      // Validation
      if (!fullName) { alert('Full name is required'); return; }
      if (!email) { alert('Email is required'); return; }
      if (!password) { alert('Password is required'); return; }
      if (password !== confirmPassword) { alert('Passwords do not match'); return; }
      if (password.length < 6) { alert('Password must be at least 6 characters'); return; }
      if (!role) { alert('Role is required'); return; }

      // Prepare payload (matches backend expected fields)
      const userData = {
        name: fullName,
        email,
        password,
        role,
        employeeId,
        departmentId,
        phone,
        gender,
        title,
        yearsExperience,
        hireDate
      };

      // Disable button & show spinner
      submitBtn.disabled = true;
      submitText.classList.add('hidden');
      submitSpinner.classList.remove('hidden');

      try {
        const response = await fetch(`${API_BASE}/admin/users`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${getToken()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(userData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          alert('✅ User created successfully!');
          window.location.href = '/current-users.html';
        } else {
          alert(data.message || 'Failed to create user. Please try again.');
        }
      } catch (err) {
        console.error('Create user error:', err);
        alert('Network error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitText.classList.remove('hidden');
        submitSpinner.classList.add('hidden');
      }
    });

    // ========== LOGOUT ==========
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      window.location.href = 'http://localhost:3000/login';
    });

    // ========== HELPER FUNCTIONS ==========
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // ========== INIT ==========
    if (checkAuth()) {
      loadDepartments();
    }
  </script>
</body>
</html>
