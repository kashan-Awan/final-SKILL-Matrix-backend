<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Control - Current Users</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Inter', sans-serif; }</style>
  <style>.hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
</head>
<body class="bg-[#F8F9FC] text-[#334155] min-h-screen flex flex-col pb-24">
<header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-100 shadow-sm">
      <img alt="Admin Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-wVJfEQLu0B1GaVV46jrgeJAHAbjGmNzJYALYBu8ujj_Ofl2trS_vmLUdPNPm-Xx-Z9VKVy3LZXDJvnRIcQbcgnELONMGodlGw7ViWLEsnSD7duCqbhtT4-dctRmDQO0cL6-EKwS8Ql5zoxfaJw4caRV2VhNi2Csgkzo7xhlD2XSLNe48jB9LFVz9x8JTZth6qdxSnYOIRDJb-Y-W5NipegkJkpqRk0P_lYJl9rUV4p3EBOpsNGJNCXFrKxEIDdpCZoA-hurq7Fg"/>
    </div>
    <h1 class="text-xl font-bold text-[#1E3A8A]">Admin Control</h1>
  </div>
  <button class="p-2 text-gray-500 hover:text-gray-700 transition-colors">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
</header>
<main class="flex-1 p-4 flex flex-col gap-6">
  <section class="relative">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    </div>
    <input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl bg-white focus:ring-blue-500 focus:border-blue-500 text-sm shadow-sm" placeholder="Search users, roles, or IDs..." type="text"/>
  </section>
  <section class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar" data-purpose="filter-chips">
    <button class="px-6 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-semibold flex-shrink-0">All</button>
    <button class="px-5 py-2 rounded-lg bg-[#E2E8F0] text-[#475569] text-sm font-semibold hover:bg-gray-300 transition-colors flex-shrink-0">Manager</button>
    <button class="px-5 py-2 rounded-lg bg-[#E2E8F0] text-[#475569] text-sm font-semibold hover:bg-gray-300 transition-colors flex-shrink-0">Employee</button>
    <button class="px-5 py-2 rounded-lg bg-[#E2E8F0] text-[#475569] text-sm font-semibold hover:bg-gray-300 transition-colors flex-shrink-0">Pending</button>
  </section>
  <section class="flex flex-col gap-4" data-purpose="user-cards-list">
    <!-- User cards will be rendered here by JS -->
  </section>
  <div class="flex justify-center mt-4">
    <button class="px-10 py-3 border border-gray-300 rounded-xl text-[#1E3A8A] font-bold text-lg hover:bg-white active:scale-95 transition-all shadow-sm bg-white/50">Load More Users</button>
  </div>
</main>
<div class="fixed bottom-24 right-4 z-40">
  <button class="w-16 h-16 bg-[#1E3A8A] text-white rounded-2xl shadow-xl flex items-center justify-center hover:bg-[#1e40af] transition-transform active:scale-90">
    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
  </button>
</div>
<nav class="fixed bottom-0 inset-x-0 bg-[#F8F9FC] border-t border-gray-200 flex items-center justify-around py-3 px-4 z-50">
  <button class="flex flex-col items-center bg-[#1E3A8A] text-white py-2 px-8 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Users</span>
  </button>
  <button class="flex flex-col items-center text-gray-500 hover:text-[#1E3A8A] transition-colors py-2 px-8">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Approvals</span>
  </button>
</nav>
<script>
const filterButtons = document.querySelectorAll('[data-purpose="filter-chips"] button');
const userCardsList = document.querySelector('[data-purpose="user-cards-list"]');

// Fetch and render current users (customize endpoint if needed)
async function loadUsers(roleFilter = null) {
  userCardsList.innerHTML = '<div class="text-gray-400">Loading users...</div>';
  try {
    const res = await fetch('http://localhost:5000/api/user');
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'Failed to load users');
    let users = data.data || [];
    // Filter for current/active users. Adjust this filter as needed based on your backend data structure.
    users = users.filter(u => u.isActive || u.status === 'active' || u.is_current || u.isActive === 1);
    if (roleFilter && roleFilter !== 'All') {
      users = users.filter(u => u.role && u.role.toLowerCase() === roleFilter.toLowerCase());
    }
    if (!users.length) {
      userCardsList.innerHTML = '<div class="text-gray-400">No current users found.</div>';
      return;
    }
    userCardsList.innerHTML = users.map(user => `
      <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-full overflow-hidden border border-gray-200">
          <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || user.email)}&background=1E3A8A&color=fff" alt="User Avatar" class="w-full h-full object-cover" />
        </div>
        <div class="flex-1">
          <div class="font-bold text-lg text-[#1E3A8A]">${user.name || ''}</div>
          <div class="text-sm text-gray-500">${user.email || ''}</div>
          <div class="text-xs text-gray-400 mt-1">${user.role || ''}</div>
        </div>
        <div class="text-xs text-gray-500">${user.employeeId || ''}</div>
      </div>
    `).join('');
  } catch (err) {
    userCardsList.innerHTML = `<div class="text-red-500">${err.message}</div>`;
  }
}

// Initial load
loadUsers();

// Filter logic
filterButtons.forEach(button => {
  button.addEventListener('click', () => {
    filterButtons.forEach(btn => {
      btn.classList.remove('bg-[#1E3A8A]', 'text-white');
      btn.classList.add('bg-[#E2E8F0]', 'text-[#475569]');
    });
    button.classList.remove('bg-[#E2E8F0]', 'text-[#475569]');
    button.classList.add('bg-[#1E3A8A]', 'text-white');
    loadUsers(button.textContent.trim());
  });
});
</script>
<style>
@media (min-width: 640px) {
  main { max-width: 600px; margin-left: auto; margin-right: auto; }
}
@media (min-width: 1024px) {
  main { max-width: 900px; }
}
</style>
</body>
</html>
