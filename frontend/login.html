<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-gray-700">Email</label>
        <input type="email" id="email" class="w-full p-2 border rounded" required />
      </div>
      <div>
        <label class="block text-gray-700">Password</label>
        <input type="password" id="password" class="w-full p-2 border rounded" required />
      </div>
      <div>
        <label class="block text-gray-700">Role</label>
        <select id="role" class="w-full p-2 border rounded" required>
          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="employee">Employee</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
      <div id="errorMsg" class="text-red-600 text-sm mt-2 hidden"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');
      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password, role })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('Login successful!');
          // Redirect or load dashboard here
        } else {
          errorMsg.textContent = data.message || 'Login failed. Please try again.';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
